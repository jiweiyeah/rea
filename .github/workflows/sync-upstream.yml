name: Sync upstream

on:
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC = 09:00 Beijing time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Require a token that may modify workflows
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [[ -z "${SYNC_TOKEN}" ]]; then
            echo "SYNC_TOKEN is not configured." >&2
            echo "The default GITHUB_TOKEN cannot add or update files under .github/workflows/, and upstream adds them regularly." >&2
            echo "Create a personal access token with the repo and workflow scopes, then store it as the SYNC_TOKEN secret." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Merge morluto/rea main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41808238+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/morluto/rea.git
          git fetch --no-tags upstream main
          git merge --no-edit FETCH_HEAD
          git push origin HEAD:refs/heads/main
