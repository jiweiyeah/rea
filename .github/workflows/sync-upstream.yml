name: Sync upstream

on:
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC = 09:00 Beijing time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge morluto/rea main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41808238+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/morluto/rea.git
          git fetch --no-tags upstream main
          git merge --no-edit FETCH_HEAD
          git push origin HEAD:refs/heads/main
